# Values come from the repo-root .env (never committed). See .env.example.
spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: basamak
  lifecycle:
    # open SSE streams must not hold a restart for minutes; clients reconnect with Last-Event-ID
    timeout-per-shutdown-phase: 15s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:basamak}
    username: ${DB_USER:basamak}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
logging:
  structured:
    format:
      console: ecs
basamak:
  web-base-url: ${WEB_BASE_URL:http://localhost:5173}
  cms-base-url: ${CMS_BASE_URL:http://localhost:5174}
  api-base-url: ${API_BASE_URL:http://localhost:8080}
  jwt-secret: ${JWT_SECRET}
  encryption-key: ${ENCRYPTION_KEY}
  cert-secret: ${CERT_SECRET}
  ai-provider: ${AI_PROVIDER:mock}
  # uploaded lesson media (outside the repo; gitignored data/)
  media-dir: ${MEDIA_DIR:data/media}
  tools:
    # host:port pairs that STAFF (CMS) tools may call although they are local; never applies to member tools
    trusted-hosts: ${TOOLS_TRUSTED_HOSTS:localhost:8090,127.0.0.1:8090}
  jobs:
    workers: ${JOB_WORKERS:4}
