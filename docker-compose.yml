# Local infrastructure. STATUS: not yet verified (Docker not installed on the dev machine yet) - see README.
# Usage: docker compose up -d   (then run backend + apps, or later: docker compose --profile app up)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-basamak}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-basamak}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-basamak}"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
